spring:
  config:
    activate:
      on-profile: test
  datasource:
    url: jdbc:h2:mem:sicms_test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DATABASE_TO_LOWER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  flyway:
    enabled: true
    locations: classpath:db/migration
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration

security:
  jwt:
    secret: test-only-secret-that-is-long-enough-for-hs256
    access-token-expiration: PT15M