spring:
  application:
    name: sicms-backend
  profiles:
    default: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/sicms
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
server:
  port: 8080
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  document-storage:
    path: ${DOCUMENT_STORAGE_PATH:./var/documents}
    max-file-size: ${MAX_FILE_SIZE:10MB}
security:
  jwt:
    secret: ${JWT_SECRET:7Kp9xR2mV8qN4tY6cF3wH1sJ5uB0dLZa}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
sicms:
  demo-data:
    enabled: ${APP_DEMO_DATA_ENABLED:true}
    reset: ${APP_DEMO_DATA_RESET:true}
    expected-database: ${APP_DEMO_DATA_DATABASE:sicms}
    customer-password: ${SICMS_DEMO_CUSTOMER_PASSWORD:Maya@Thompson}
    agent-password: ${SICMS_DEMO_AGENT_PASSWORD:Ethan@Brooks}
    claims-officer-password: ${SICMS_DEMO_CLAIMS_OFFICER_PASSWORD:Priya@Raman}
    administrator-password: ${SICMS_DEMO_ADMIN_PASSWORD:Daniel@Mercer}
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never