spring:
  application:
    name: sicms-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: jdbc:postgresql://localhost:5432/sicms
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:root}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  servlet:
    multipart:
      max-file-size: ${MAX_FILE_SIZE:10MB}
      max-request-size: ${MAX_REQUEST_SIZE:12MB}
server:
  port: 8080
application:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  document-storage:
    path: ${DOCUMENT_STORAGE_PATH:./var/documents}
    max-file-size: ${MAX_FILE_SIZE:10MB}
security:
  jwt:
    secret: ${JWT_SECRET:7Kp9xR2mV8qN4tY6cF3wH1sJ5uB0dLZa}
    access-token-expiration: ${JWT_ACCESS_TOKEN_EXPIRATION:PT15M}
sicms:
  development:
    bootstrap-accounts:
      enabled: ${BOOTSTRAP_ACCOUNTS_ENABLED:true}
      agent:
        email: agent.local@example.test
        password: ${DEV_AGENT_PASSWORD:LocalAgent!2026}
        first-name: Local
        last-name: Agent
      claims-officer:
        email: claims.officer.local@example.test
        password: ${DEV_CLAIMS_OFFICER_PASSWORD:LocalClaims!2026}
        first-name: Local
        last-name: ClaimsOfficer
      administrator:
        email: administrator.local@example.test
        password: ${DEV_ADMINISTRATOR_PASSWORD:LocalAdmin!2026}
        first-name: Local
        last-name: Administrator
management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never